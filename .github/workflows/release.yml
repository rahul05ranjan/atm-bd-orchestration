name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag on main (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_ARTIFACT_MANIFEST: release/publish-artifacts.toml

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify existing release tag is on main
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: '$RELEASE_TAG' (expected vX.Y.Z)" >&2
            exit 1
          fi
          git fetch origin --prune --tags
          remote_tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$remote_tag_sha"
          if ! git merge-base --is-ancestor "$remote_tag_sha" origin/main; then
            echo "Tag ${RELEASE_TAG} is not an ancestor of origin/main" >&2
            exit 1
          fi
          python3 .github/scripts/release_artifacts.py verify-version \
            --manifest "$RELEASE_ARTIFACT_MANIFEST" \
            --workspace-toml apps/atm-bd-console/pyproject.toml \
            --version "${RELEASE_TAG#v}"
      - name: Verify immutable release prerequisite before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/release_immutability.py --tag "$RELEASE_TAG"
      - name: Build wheels (setuptools)
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir dist 'apps/atm-bd-console'
      - name: Build sdist (setuptools)
        run: |
          python -m pip install build==1.3.0
          python -m build --sdist --outdir dist 'apps/atm-bd-console'
      - name: Verify collected Python distributions
        run: python3 .github/scripts/release_artifacts.py verify-python-release-assets --manifest "$RELEASE_ARTIFACT_MANIFEST" --asset-dir dist
      - uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz

  release:
    needs: build-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - id: immutable_release_state
        name: Recheck immutable release prerequisite before asset upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          result="$(python3 .github/scripts/release_immutability.py --tag "$RELEASE_TAG")"
          echo "state=$(jq -r '.release_state' <<<"$result")" >> "$GITHUB_OUTPUT"

      - id: expected_assets
        name: Read expected release asset patterns from manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'patterns<<EOF'
            python3 .github/scripts/release_artifacts.py release-asset-patterns --manifest "${RELEASE_ARTIFACT_MANIFEST}"
            echo '^atm_bd-[0-9].*\.whl$'
            echo '^atm_bd-[0-9].*\.tar\.gz$'
            echo '^checksums\.txt$'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - id: published_release_probe
        name: Probe for an already-complete published release (fail closed)
        uses: ./.github/actions/verify-published-release
        with:
          release_tag: ${{ inputs.tag }}
          asset_patterns: ${{ steps.expected_assets.outputs.patterns }}
          probe: 'true'

      - name: Deny modification of an incomplete immutable release
        if: ${{ steps.immutable_release_state.outputs.state == 'immutable' && steps.published_release_probe.outputs.release_state != 'complete' }}
        run: |
          echo "Published immutable release is missing required assets; use a new version." >&2
          exit 1

      - name: Skip upload for the already-complete release
        if: ${{ steps.published_release_probe.outputs.release_state == 'complete' }}
        run: echo "GitHub Release ${{ inputs.tag }} already exists with every expected asset; skipping upload. Immutable release assets cannot be replaced."

      - name: Download all artifacts
        if: ${{ steps.published_release_probe.outputs.release_state != 'complete' }}
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect archives
        if: ${{ steps.published_release_probe.outputs.release_state != 'complete' }}
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.tgz' \) -exec mv {} release/ \;
          find artifacts -type f -name '*.whl' -exec mv {} release/ \;
          ls -la release/

      - name: Verify collected Python distributions
        if: ${{ steps.published_release_probe.outputs.release_state != 'complete' }}
        run: python3 .github/scripts/release_artifacts.py verify-python-release-assets --manifest "$RELEASE_ARTIFACT_MANIFEST" --asset-dir release

      - name: Generate checksums
        if: ${{ steps.published_release_probe.outputs.release_state != 'complete' }}
        working-directory: release
        run: |
          files=()
          for pattern in *.tar.gz *.zip *.whl *.tgz; do
            for file in $pattern; do
              [[ -e "$file" ]] || continue
              files+=("$file")
            done
          done
          sha256sum "${files[@]}" > checksums.txt

      - name: Create GitHub Release
        if: ${{ steps.published_release_probe.outputs.release_state != 'complete' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            release/*

      - name: Verify finalized release immutability before downstream publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/release_immutability.py --tag "$RELEASE_TAG" --finalized
