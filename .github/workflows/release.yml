name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string
      target:
        description: "Release target"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - production
      replace_release_assets:
        description: "Legacy compatibility input; true is rejected by the immutable-release prerequisite"
        required: false
        type: boolean
        default: false
      already_published_channels:
        description: "Optional comma-separated channel names preserved from a prior release run for this exact version"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  RELEASE_ARTIFACT_MANIFEST: release/publish-artifacts.toml

jobs:
  gate-and-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
      release_target: ${{ steps.meta.outputs.release_target }}
      build_ref: ${{ steps.release-ref.outputs.build_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Normalize version input
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          raw='${{ github.event.inputs.version }}'
          target='${{ github.event.inputs.target }}'
          tag="$raw"
          [[ "$tag" == v* ]] || tag="v${tag}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: '$raw' (expected X.Y.Z or vX.Y.Z)" >&2
            exit 1
          fi
          if [[ "$target" != "testpypi" && "$target" != "production" ]]; then
            echo "Invalid target: '$target' (expected testpypi or production)" >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "release_target=$target" >> "$GITHUB_OUTPUT"

      - name: Verify immutable release prerequisite before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          REPLACE_ASSETS: ${{ inputs.replace_release_assets }}
        run: |
          args=()
          if [[ "$REPLACE_ASSETS" == "true" ]]; then args+=(--replace-assets); fi
          python3 .github/scripts/release_immutability.py --tag "$RELEASE_TAG" "${args[@]}"

      - name: Read build plan from release manifest
        id: build_plan
        shell: bash
        run: |
          set -euo pipefail
          plan="$(python3 .github/scripts/release_artifacts.py build-plan --manifest "${RELEASE_ARTIFACT_MANIFEST}")"
          {
            echo "workspace_toml=$(jq -r '.workspace_toml' <<<"${plan}")"
            echo "has_crates=$(jq -r '.has_crates' <<<"${plan}")"
            echo "has_release_binaries=$(jq -r '.has_release_binaries' <<<"${plan}")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify requested version matches workspace
        run: |
          python3 .github/scripts/release_artifacts.py verify-version \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --workspace-toml '${{ steps.build_plan.outputs.workspace_toml }}' \
            --version '${{ steps.meta.outputs.release_version }}'

      - name: Verify release version lockstep
        run: |
          python3 .github/scripts/release_artifacts.py verify-version-lockstep \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --workspace-toml '${{ steps.build_plan.outputs.workspace_toml }}'

      - id: candidate
        if: ${{ inputs.target == 'testpypi' }}
        name: Reuse or create release-candidate tag from main
        shell: bash
        run: |
          set -euo pipefail
          raw='${{ github.event.inputs.version }}'
          release_tag="$raw"
          [[ "$release_tag" == v* ]] || release_tag="v${release_tag}"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "Invalid version: '$raw' (expected X.Y.Z or vX.Y.Z)" >&2; exit 1; }
          candidate_tag="release-candidate-${release_tag}"

          git fetch origin main --prune --tags
          main_sha="$(git rev-parse origin/main)"
          if git rev-parse --verify "refs/tags/${candidate_tag}" >/dev/null 2>&1; then
            candidate_sha="$(git rev-parse "${candidate_tag}^{commit}")"
            git merge-base --is-ancestor "${candidate_tag}" origin/main \
              || { echo "${candidate_tag} is not an ancestor of origin/main" >&2; exit 1; }
            echo "Reusing ${candidate_tag} at ${candidate_sha}; origin/main is ${main_sha}."
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "${candidate_tag}" origin/main -m "Release candidate ${release_tag}"
            git push origin "refs/tags/${candidate_tag}"
            candidate_sha="${main_sha}"
            echo "Created ${candidate_tag} at origin/main (${candidate_sha})."
          fi
          {
            echo "tag=${candidate_tag}"
            echo "sha=${candidate_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Run release gate
        id: release_gate
        env:
          ALREADY_PUBLISHED_CHANNELS: ${{ inputs.already_published_channels }}
          RELEASE_TARGET: ${{ inputs.target }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          mode=final
          release_ref=origin/main
          if [[ "$RELEASE_TARGET" == "testpypi" ]]; then
            mode=readiness
            release_ref="$DISPATCH_SHA"
          fi
          .github/scripts/release_gate.sh "$mode" "$release_ref" "release-candidate-${{ steps.meta.outputs.release_tag }}" '${{ steps.meta.outputs.release_version }}' "${RELEASE_ARTIFACT_MANIFEST}" '${{ steps.build_plan.outputs.workspace_toml }}' "${ALREADY_PUBLISHED_CHANNELS}"
          if [[ "$RELEASE_TARGET" == "testpypi" ]]; then
            echo "release_sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify npm source at resolved release commit
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.release_gate.outputs.release_sha }}
        run: python3 .github/scripts/npm_release.py check-source --manifest "$RELEASE_ARTIFACT_MANIFEST" --tag "$RELEASE_TAG" --source-ref "$RELEASE_SHA"

      - name: Ensure tag is correct or create it
        id: release-ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune --tags
          tag='${{ steps.meta.outputs.release_tag }}'
          target='${{ steps.meta.outputs.release_target }}'
          main_sha='${{ steps.release_gate.outputs.release_sha }}'
          git rev-parse --verify "${main_sha}^{commit}" >/dev/null
          candidate_tag="release-candidate-${tag}"
          if [[ "$target" == "production" ]]; then
            if git ls-remote --exit-code --refs origin "refs/tags/${tag}" >/dev/null; then
              remote_tag_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
              if ! git merge-base --is-ancestor "$remote_tag_sha" origin/main; then
                echo "Tag ${tag} exists at ${remote_tag_sha} but is not an ancestor of origin/main (${main_sha})" >&2
                exit 1
              fi
              if ! git merge-base --is-ancestor "$candidate_tag" "$remote_tag_sha"; then
                echo "Tag ${tag} exists at ${remote_tag_sha} but does not descend from ${candidate_tag}" >&2
                exit 1
              fi
              echo "Tag ${tag} already exists at verified ancestor ${remote_tag_sha}; reusing immutable tag while building from origin/main (${main_sha})"
            else
              git tag "$tag" "$main_sha"
              git push origin "$tag"
            fi
          else
            echo "Rehearsal mode: validating release tag ${tag} locally only; not pushing any tag to origin"
          fi
          echo "build_ref=$main_sha" >> "$GITHUB_OUTPUT"
  release-plan:
    needs: gate-and-tag
    runs-on: ubuntu-latest
    outputs:
      release_target_matrix: ${{ steps.manifest.outputs.release_target_matrix }}
      python_wheel_matrix: ${{ steps.manifest.outputs.python_wheel_matrix }}
      python_sdist_matrix: ${{ steps.manifest.outputs.python_sdist_matrix }}
      has_crates: ${{ steps.manifest.outputs.has_crates }}
      has_release_binaries: ${{ steps.manifest.outputs.has_release_binaries }}
      has_python_wheels: ${{ steps.manifest.outputs.has_python_wheels }}
      has_python_sdists: ${{ steps.manifest.outputs.has_python_sdists }}
      python_upload_tool: ${{ steps.manifest.outputs.python_upload_tool }}
      rust_toolchain: ${{ steps.manifest.outputs.rust_toolchain }}
      workspace_toml: ${{ steps.manifest.outputs.workspace_toml }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate-and-tag.outputs.build_ref }}
      - id: manifest
        name: Read Python distribution matrices from release manifest
        shell: bash
        run: |
          set -euo pipefail
          echo "release_target_matrix=$(python3 .github/scripts/release_artifacts.py release-target-matrix --manifest "${RELEASE_ARTIFACT_MANIFEST}")" >> "$GITHUB_OUTPUT"
          echo "python_wheel_matrix=$(python3 .github/scripts/release_artifacts.py python-wheel-matrix --manifest "${RELEASE_ARTIFACT_MANIFEST}")" >> "$GITHUB_OUTPUT"
          echo "python_sdist_matrix=$(python3 .github/scripts/release_artifacts.py python-sdist-matrix --manifest "${RELEASE_ARTIFACT_MANIFEST}")" >> "$GITHUB_OUTPUT"
          plan="$(python3 .github/scripts/release_artifacts.py build-plan --manifest "${RELEASE_ARTIFACT_MANIFEST}")"
          {
            echo "has_crates=$(jq -r '.has_crates' <<<"${plan}")"
            echo "has_release_binaries=$(jq -r '.has_release_binaries' <<<"${plan}")"
            echo "has_python_wheels=$(jq -r '.has_python_wheels' <<<"${plan}")"
            echo "has_python_sdists=$(jq -r '.has_python_sdists' <<<"${plan}")"
            echo "python_upload_tool=$(jq -r '.python_upload_tool' <<<"${plan}")"
            echo "rust_toolchain=$(jq -r '.rust_toolchain' <<<"${plan}")"
            echo "workspace_toml=$(jq -r '.workspace_toml' <<<"${plan}")"
          } >> "$GITHUB_OUTPUT"
  build-python-wheels:
    if: ${{ needs.release-plan.outputs.has_python_wheels == 'true' }}
    needs: [gate-and-tag, release-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.python_wheel_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate-and-tag.outputs.build_ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-release-build
        with:
          release_ref: ${{ needs.gate-and-tag.outputs.build_ref }}
          release_version: ${{ needs.gate-and-tag.outputs.release_version }}
          pyproject: ${{ matrix.pyproject }}
          build_system: ${{ matrix.build_system }}
          install_maturin_zig: ${{ matrix.os == 'ubuntu-24.04-arm' || (matrix.manylinux != '' && matrix.manylinux != 'off') }}
          rust_toolchain: ${{ needs.release-plan.outputs.rust_toolchain }}
          workspace_toml: ${{ needs.release-plan.outputs.workspace_toml }}
      - name: Build wheels (maturin)
        if: ${{ matrix.build_system == 'maturin' && matrix.target == '' && matrix.os != 'ubuntu-24.04-arm' }}
        run: maturin build --release --manifest-path ${{ matrix.cargo_manifest }} --out dist
      - name: Build ARM64 Linux wheel (maturin + Zig)
        if: ${{ matrix.build_system == 'maturin' && matrix.target == '' && matrix.os == 'ubuntu-24.04-arm' }}
        run: >-
          maturin build --release --manifest-path ${{ matrix.cargo_manifest }} --out dist
          --compatibility manylinux2014 --zig
      - name: Build declared wheel target (maturin)
        if: ${{ matrix.build_system == 'maturin' && matrix.target != '' }}
        shell: bash
        env:
          WHEEL_TARGET: ${{ matrix.target }}
          WHEEL_MANYLINUX: ${{ matrix.manylinux }}
          CARGO_MANIFEST: ${{ matrix.cargo_manifest }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: |
          set -euo pipefail
          rustup target add "$WHEEL_TARGET"
          args=(--release --locked --manifest-path "$CARGO_MANIFEST" --out dist --target "$WHEEL_TARGET")
          if [[ "$WHEEL_MANYLINUX" != "off" ]]; then
            args+=(--compatibility "manylinux_${WHEEL_MANYLINUX}" --zig)
          fi
          maturin build "${args[@]}"
      - name: Build wheels (setuptools)
        if: ${{ matrix.build_system == 'setuptools' }}
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir dist '${{ matrix.source }}'
      - name: Verify declared wheel platform
        shell: bash
        if: ${{ matrix.platform != '' }}
        env:
          WHEEL_PLATFORM: ${{ matrix.platform }}
        run: python3 .github/scripts/release_python.py --asset-dir dist --platform "$WHEEL_PLATFORM"
      - uses: actions/upload-artifact@v6
        with:
          name: python-wheel-${{ matrix.artifact }}-${{ matrix.id || matrix.os }}
          path: dist/*.whl
  build-python-sdists:
    if: ${{ needs.release-plan.outputs.has_python_sdists == 'true' }}
    needs: [gate-and-tag, release-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.python_sdist_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate-and-tag.outputs.build_ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-release-build
        with:
          release_ref: ${{ needs.gate-and-tag.outputs.build_ref }}
          release_version: ${{ needs.gate-and-tag.outputs.release_version }}
          pyproject: ${{ matrix.pyproject }}
          build_system: ${{ matrix.build_system }}
          rust_toolchain: ${{ needs.release-plan.outputs.rust_toolchain }}
          workspace_toml: ${{ needs.release-plan.outputs.workspace_toml }}
      - name: Build sdist (maturin)
        if: ${{ matrix.build_system == 'maturin' }}
        run: maturin sdist --manifest-path ${{ matrix.cargo_manifest }} --out dist
      - name: Build sdist (setuptools)
        if: ${{ matrix.build_system == 'setuptools' }}
        run: |
          python -m pip install build==1.3.0
          python -m build --sdist --outdir dist '${{ matrix.source }}'
      - uses: actions/upload-artifact@v6
        with:
          name: python-sdist-${{ matrix.artifact }}
          path: dist/*.tar.gz
  publish-testpypi:
    # TestPyPI remains part of the non-production rehearsal. Production PyPI
    # publication is deliberately handled by pypi-publish.yml after the
    # immutable GitHub Release exists. Wheel/sdist jobs may be skipped when
    # the manifest declares no matching Python distributions.
    if: >-
      ${{ !failure() && !cancelled() &&
          needs.gate-and-tag.outputs.release_target == 'testpypi' &&
          (needs.build-python-wheels.result == 'success' || needs.build-python-sdists.result == 'success') }}
    needs: [gate-and-tag, release-plan, build-python-wheels, build-python-sdists]
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate-and-tag.outputs.build_ref }}
      - uses: actions/download-artifact@v7
        with:
          pattern: 'python-wheel-*'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v7
        with:
          pattern: 'python-sdist-*'
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install maturin
        if: ${{ needs.release-plan.outputs.python_upload_tool == 'maturin' }}
        run: python -m pip install maturin==1.9.4
      - name: Install twine
        if: ${{ needs.release-plan.outputs.python_upload_tool == 'twine' }}
        run: python -m pip install twine==6.1.0
      - name: Verify manifest-declared Python release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release_artifacts.py verify-python-release-assets \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --asset-dir dist
      - name: Publish wheels and sdist to TestPyPI
        if: ${{ needs.release-plan.outputs.python_upload_tool == 'maturin' }}
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
          MATURIN_NON_INTERACTIVE: "1"
        run: maturin upload --repository testpypi --non-interactive --skip-existing dist/*.whl dist/*.tar.gz
      - name: Publish wheels and sdist to TestPyPI with twine
        if: ${{ needs.release-plan.outputs.python_upload_tool == 'twine' }}
        env:
          TWINE_NON_INTERACTIVE: "1"
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: python -m twine upload --repository testpypi --skip-existing dist/*.whl dist/*.tar.gz
  release:
    # Runs whenever every needed job succeeded or was legitimately skipped
    # (crates or Python legs may be absent for this consumer). The GitHub
    # Release leg deliberately does not depend on crates.io publication: a
    # failed crates leg is retried in isolation via crates-publish.yml while
    # the release and its dependent post-release channels proceed.
    if: >-
      ${{ !failure() && !cancelled() &&
          needs.gate-and-tag.outputs.release_target == 'production' &&
          (needs.build-python-wheels.result == 'success' && needs.build-python-sdists.result == 'success') }}
    needs: [gate-and-tag, build-python-wheels, build-python-sdists]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate-and-tag.outputs.build_ref }}

      - id: immutable_release_state
        name: Recheck immutable release prerequisite before asset upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate-and-tag.outputs.release_tag }}
        run: |
          result="$(python3 .github/scripts/release_immutability.py --tag "$RELEASE_TAG")"
          echo "state=$(jq -r '.release_state' <<<"$result")" >> "$GITHUB_OUTPUT"

      - id: expected_assets
        name: Read expected release asset patterns from manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'patterns<<EOF'
            python3 .github/scripts/release_artifacts.py release-asset-patterns --manifest "${RELEASE_ARTIFACT_MANIFEST}"
            echo '^checksums\.txt$'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Detect-and-skip: rebuilt archives are not reproducible, so re-uploading
      # over an existing complete release would silently change asset SHA256s
      # that Homebrew/Scoop may already pin. The legacy replacement opt-in is
      # rejected by gate-and-tag. The probe fails closed: only a
      # confirmed-absent (or confirmed-incomplete) release proceeds to
      # build/upload; an indeterminate probe result fails this job instead of
      # silently rebuilding over already-digested assets.
      - id: published_release_probe
        name: Probe for an already-complete published release (fail closed)
        uses: ./.github/actions/verify-published-release
        with:
          release_tag: ${{ needs.gate-and-tag.outputs.release_tag }}
          asset_patterns: ${{ steps.expected_assets.outputs.patterns }}
          probe: 'true'

      - name: Deny modification of an incomplete immutable release
        if: ${{ steps.immutable_release_state.outputs.state == 'immutable' && steps.published_release_probe.outputs.release_state != 'complete' }}
        run: |
          echo "Published immutable release is missing required assets; use a new version." >&2
          exit 1

      - name: Skip upload for the already-complete release
        if: ${{ steps.published_release_probe.outputs.release_state == 'complete' && inputs.replace_release_assets != true }}
        run: echo "GitHub Release ${{ needs.gate-and-tag.outputs.release_tag }} already exists with every expected asset; skipping upload. Immutable release assets cannot be replaced."

      - name: Log explicit asset replacement opt-in
        if: ${{ steps.published_release_probe.outputs.release_state == 'complete' && inputs.replace_release_assets == true }}
        run: echo "replace_release_assets=true; deliberately replacing assets on published release ${{ needs.gate-and-tag.outputs.release_tag }} (their SHA256s will change)."

      - name: Download all artifacts
        if: ${{ steps.published_release_probe.outputs.release_state != 'complete' || inputs.replace_release_assets == true }}
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect archives
        if: ${{ steps.published_release_probe.outputs.release_state != 'complete' || inputs.replace_release_assets == true }}
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.tgz' \) -exec mv {} release/ \;
          find artifacts -type f -name '*.whl' -exec mv {} release/ \;
          ls -la release/

      - name: Verify collected Python distributions
        if: ${{ steps.published_release_probe.outputs.release_state != 'complete' || inputs.replace_release_assets == true }}
        run: python3 .github/scripts/release_artifacts.py verify-python-release-assets --manifest "$RELEASE_ARTIFACT_MANIFEST" --asset-dir release

      - name: Generate checksums
        if: ${{ steps.published_release_probe.outputs.release_state != 'complete' || inputs.replace_release_assets == true }}
        working-directory: release
        run: |
          files=()
          for pattern in *.tar.gz *.zip *.whl *.tgz; do
            for file in $pattern; do
              [[ -e "$file" ]] || continue
              files+=("$file")
            done
          done
          sha256sum "${files[@]}" > checksums.txt

      - name: Create GitHub Release
        if: ${{ steps.published_release_probe.outputs.release_state != 'complete' || inputs.replace_release_assets == true }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.gate-and-tag.outputs.release_tag }}
          generate_release_notes: true
          files: |
            release/*

      - name: Verify finalized release immutability before downstream publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate-and-tag.outputs.release_tag }}
        run: python3 .github/scripts/release_immutability.py --tag "$RELEASE_TAG" --finalized
