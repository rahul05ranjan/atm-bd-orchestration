name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  console-tests:
    name: console (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SC_COMPOSE_VERSION: "1.7.0"
      SC_COMPOSE_SHA256: 5e2ffeb47072b26c47a44bfcc0d7068d0dfb8d5742feecc309fc535dab2e1c84
      UV_TOOL_DIR: ${{ github.workspace }}/../console-tools
      UV_TOOL_BIN_DIR: ${{ github.workspace }}/../console-bin
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]   # build==1.3.0 crashes on 3.15 argparse (HelpFormatter color kwarg)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the console build hook embeds rev-list count + sha and refuses shallow checkouts
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - name: Install sc-compose ${{ env.SC_COMPOSE_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          asset="sc-compose_${SC_COMPOSE_VERSION}_x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/randlee/sc-compose/releases/download/v${SC_COMPOSE_VERSION}/$asset"
          echo "${SC_COMPOSE_SHA256}  $RUNNER_TEMP/$asset" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sc-compose"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/sc-compose"
          bin="$(find "$RUNNER_TEMP/sc-compose" -type f -name sc-compose | head -n 1)"
          test -n "$bin"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$bin" "$HOME/.local/bin/sc-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install console in isolation
        run: uv tool install --python '${{ steps.python.outputs.python-path }}' ./apps/atm-bd-console
      - name: Console tests
        working-directory: apps/atm-bd-console
        run: uv run --frozen --python '${{ steps.python.outputs.python-path }}' pytest -q
      - name: Repository Python type check
        run: uv run --frozen --python '${{ steps.python.outputs.python-path }}' --project apps/atm-bd-console pyright
      - name: Release tooling tests (no publication)
        run: uv run --frozen --python '${{ steps.python.outputs.python-path }}' --project apps/atm-bd-console pytest -q .github/scripts/tests
      - name: Build distributions and check publisher compatibility
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --python '${{ steps.python.outputs.python-path }}' --with build==1.3.0 --project apps/atm-bd-console python -m build --wheel --sdist --outdir "$RUNNER_TEMP/twine-dist" apps/atm-bd-console
          uv run --frozen --python '${{ steps.python.outputs.python-path }}' --with twine==6.1.0 --project apps/atm-bd-console python -m twine check "$RUNNER_TEMP"/twine-dist/*.whl "$RUNNER_TEMP"/twine-dist/*.tar.gz
      - name: Console CLI smoke tests
        working-directory: apps/atm-bd-console
        env:
          ATM_BD_CONSOLE_BIN: ${{ env.UV_TOOL_BIN_DIR }}/atm-bd
        run: |
          "$ATM_BD_CONSOLE_BIN" --help
          uv run --frozen --python '${{ steps.python.outputs.python-path }}' pytest -q tests/test_cli.py::test_installed_cron_command_runs_one_headless_tick

  package-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sha256: 5e2ffeb47072b26c47a44bfcc0d7068d0dfb8d5742feecc309fc535dab2e1c84
          - os: macos-latest
            target: aarch64-apple-darwin
            sha256: d7590a41921bef5a428bcbd33dda48006c6f6df5eafa83217cb820240fe6544b
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SC_COMPOSE_VERSION: "1.7.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # test_real_upgrade_from_a_0_2_3_install installs 0.2.3 from history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # sc-compose publishes cp311 wheels

      - uses: astral-sh/setup-uv@v5

      # The scripts render with the sc-compose wheel; it is the same version as the CLI below
      # (the floor of the `sc-compose >=` range in plugins/atm-bd-orchestration/manifest.yaml, so the floor stays tested).
      - name: Install Python test dependencies
        run: python3 -m pip install pytest pydantic pyyaml "sc-compose==${SC_COMPOSE_VERSION}" "sc-sha>=1.7.0,<2"

      # Same pinned release asset and checksum as atm-core's tools/bootstrap.toml.
      - name: Install sc-compose ${{ env.SC_COMPOSE_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          asset="sc-compose_${SC_COMPOSE_VERSION}_${{ matrix.target }}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/randlee/sc-compose/releases/download/v${SC_COMPOSE_VERSION}/$asset"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/$asset" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sc-compose"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/sc-compose"
          bin="$(find "$RUNNER_TEMP/sc-compose" -type f -name sc-compose | head -n 1)"
          test -n "$bin"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$bin" "$HOME/.local/bin/sc-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          sc-compose --version
          python3 -m pip show sc-compose | grep '^Version'
          jq --version
          python3 --version
          git --version

      - name: Generated blocks are current
        working-directory: plugins/atm-bd-orchestration
        run: python3 tests/gen_manifest.py --check

      - name: Package tests
        working-directory: plugins/atm-bd-orchestration
        run: python3 -m pytest -q -rs
