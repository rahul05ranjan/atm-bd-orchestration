name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sha256: 2e09706e0814f30adaacc88310db4ad629dcd9314d1182ecf12767686f828204
            bd_asset: beads_1.3.0_linux_amd64.tar.gz
            bd_sha256: 2f92b904ecf35b607e44dc5c39229173af69c54f1183e8d709f1773540cdcf3b
            dolt_asset: dolt-linux-amd64.tar.gz
            dolt_sha256: 0a2a318f27c5e1088a2883038573c2054e00f356dc9752e74bca934f8321959a
          - os: macos-latest
            target: aarch64-apple-darwin
            sha256: 23db29325d95c0f4bb94dead48d02883e00311e82dc66820fe51b1dd855b7168
            bd_asset: beads_1.3.0_darwin_arm64.tar.gz
            bd_sha256: 7cc77367d0b84c50243a1108bc1f73648699211257d414b917540bf868e6bb85
            dolt_asset: dolt-darwin-arm64.tar.gz
            dolt_sha256: d738b9f523289e9c51dbe0e9f2623c8e032924c62fa72a443703020adf099d27
    runs-on: ${{ matrix.os }}
    env:
      SC_COMPOSE_VERSION: "1.6.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # test_real_upgrade_from_a_0_2_3_install installs 0.2.3 from history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # sc-compose publishes cp311 wheels

      # The scripts render with the sc-compose wheel; it is the same version as the CLI below
      # (the `sc-compose ==` pin in plugins/atm-bd-orchestration/manifest.yaml).
      - name: Install Python test dependencies
        run: python3 -m pip install pytest pydantic pyyaml "sc-compose==${SC_COMPOSE_VERSION}"

      # Same pinned release asset and checksum as atm-core's tools/bootstrap.toml.
      - name: Install sc-compose ${{ env.SC_COMPOSE_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          asset="sc-compose_${SC_COMPOSE_VERSION}_${{ matrix.target }}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/randlee/sc-compose/releases/download/v${SC_COMPOSE_VERSION}/$asset"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/$asset" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sc-compose"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/sc-compose"
          bin="$(find "$RUNNER_TEMP/sc-compose" -type f -name sc-compose | head -n 1)"
          test -n "$bin"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$bin" "$HOME/.local/bin/sc-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # validate-plan (run by the installed skill suites) requires bd on PATH.
      - name: Install bd 1.3.0
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ matrix.bd_asset }}"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "https://github.com/steveyegge/beads/releases/download/v1.3.0/$asset"
          echo "${{ matrix.bd_sha256 }}  $RUNNER_TEMP/$asset" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bd"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/bd"
          bin="$(find "$RUNNER_TEMP/bd" -type f -name bd | head -n 1)"
          test -n "$bin"
          install -m 0755 "$bin" "$HOME/.local/bin/bd"

      # The real-bd pour tests (scripts/tests/test_bead_pour_mock.py) run bd in
      # proxied-server mode, whose backend is the dolt binary.
      - name: Install dolt 2.3.1
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ matrix.dolt_asset }}"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "https://github.com/dolthub/dolt/releases/download/v2.3.1/$asset"
          echo "${{ matrix.dolt_sha256 }}  $RUNNER_TEMP/$asset" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/dolt"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/dolt"
          bin="$(find "$RUNNER_TEMP/dolt" -type f -name dolt | head -n 1)"
          test -n "$bin"
          install -m 0755 "$bin" "$HOME/.local/bin/dolt"
          git config --global user.name "ci" && git config --global user.email "ci@example.invalid"
          dolt config --global --add user.name ci && dolt config --global --add user.email ci@example.invalid

      - name: Tool versions
        run: |
          sc-compose --version
          python3 -m pip show sc-compose | grep '^Version'
          bd --version
          dolt version
          jq --version
          python3 --version
          git --version

      - name: Generated blocks are current
        working-directory: plugins/atm-bd-orchestration
        run: python3 tests/gen_manifest.py --check

      - name: Package tests
        working-directory: plugins/atm-bd-orchestration
        run: python3 -m pytest -q -rs
