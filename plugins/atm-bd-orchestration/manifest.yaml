# Installation policy/metadata
install:
  scope: local-only  # the skills run repo-relative scripts (.claude/skills/...), so only a repo's .claude/.codex
  hook: install.py   # renders .claude/project/atm-bd-orchestration.yaml, places and records every file

# Runtime requirements
requires:
  - python3 >= 3.11
  - pyyaml
  - pydantic
  - sc-compose >= 1.7.0, < 2  # CLI and Python wheel, the same version in this range: install.sc_compose_range()
  - atm >= 1.6.1
  - bd >= 1.3.0
  - jq >= 1.6
  - git >= 2.27
  - atm-bd >= 0.1.0
