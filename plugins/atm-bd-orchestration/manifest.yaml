name: atm-bd-orchestration
version: 0.16.0
description: >
  Bead-driven phase orchestration for ATM agent teams: the phase plan as a
  beads graph (atm-beads), dispatch, dev-sanity, QA and stack landing driven
  by `bd ready` (atm-bd-orchestration), and sprint status tables and DAGs
  from live beads (sprint-report), with the sanity-check agents they name.
author: randlee
license: MIT
tags:
  - atm
  - beads
  - orchestration
  - sprint
  - qa
  - gh-stack

