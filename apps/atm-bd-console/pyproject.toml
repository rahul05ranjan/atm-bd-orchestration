[project]
name = "atm-bd"
version = "0.16.1"
requires-python = ">=3.11"
dependencies = ["rich>=15.0.0,<16", "textual>=8.2.8,<9", "sc-observability>=1.5.0,<2", "pyyaml", "pydantic", "sc-compose>=1.7.0,<2"]

[project.scripts]
atm-bd = "atm_bd_console.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atm_bd_console"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
