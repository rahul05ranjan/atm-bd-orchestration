[project]
name = "atm-bd-console"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["rich", "textual", "sc-observability>=1.5.0"]

[project.scripts]
atm-bd-console = "atm_bd_console.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
